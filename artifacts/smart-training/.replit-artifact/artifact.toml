kind = "web"
previewPath = "/"
title = "Smart Training Marketplace"
version = "1.0.0"
id = "artifacts/smart-training"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19606

[services.development]
run = "pnpm --filter @workspace/smart-training run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-training", "run", "build" ]
publicDir = "artifacts/smart-training/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19606"
BASE_PATH = "/"

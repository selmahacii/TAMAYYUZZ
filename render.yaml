services:
  - type: web
    name: tamayuz-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm --filter "@workspace/db" run build && pnpm --filter "@workspace/api-server" run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
